apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            key: dopplerToken
            name: doppler-token
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-config
  namespace: flux-system
spec:
  data:
    - remoteRef:
        key: K3S_CLUSTER_NAME
      secretKey: K3S_CLUSTER_NAME
    - remoteRef:
        key: CLOUDFLARE_ACCOUNT_ID
      secretKey: CLOUDFLARE_ACCOUNT_ID
    - remoteRef:
        key: CLOUDFLARE_DOMAIN
      secretKey: CLOUDFLARE_DOMAIN
    - remoteRef:
        key: CLOUDFLARE_TUNNEL_NAME
      secretKey: CLOUDFLARE_TUNNEL_NAME
    - remoteRef:
        key: R2_BUCKET
      secretKey: R2_BUCKET
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    creationPolicy: Owner
    name: platform-config
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cloudflare-operator-system
spec:
  data:
    - remoteRef:
        key: CLOUDFLARE_API_TOKEN
      secretKey: CLOUDFLARE_API_TOKEN
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    creationPolicy: Owner
    name: cloudflare-api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-credentials
  namespace: borq-system
spec:
  data:
    - remoteRef:
        key: GRAFANA_CLOUD_METRICS_URL
      secretKey: GRAFANA_CLOUD_METRICS_URL
    - remoteRef:
        key: GRAFANA_CLOUD_METRICS_USERNAME
      secretKey: GRAFANA_CLOUD_METRICS_USERNAME
    - remoteRef:
        key: GRAFANA_CLOUD_LOGS_URL
      secretKey: GRAFANA_CLOUD_LOGS_URL
    - remoteRef:
        key: GRAFANA_CLOUD_LOGS_USERNAME
      secretKey: GRAFANA_CLOUD_LOGS_USERNAME
    - remoteRef:
        key: GRAFANA_CLOUD_ACCESS_POLICY_TOKEN
      secretKey: GRAFANA_CLOUD_ACCESS_POLICY_TOKEN
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    creationPolicy: Owner
    name: grafana-cloud-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  data:
    - remoteRef:
        key: TAILSCALE_OAUTH_CLIENT_ID
      secretKey: client_id
    - remoteRef:
        key: TAILSCALE_OAUTH_CLIENT_SECRET
      secretKey: client_secret
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    creationPolicy: Owner
    name: operator-oauth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r2-backup-credentials
  namespace: borq-system
spec:
  data:
    - remoteRef:
        key: R2_ACCESS_KEY_ID
      secretKey: ACCESS_KEY_ID
    - remoteRef:
        key: R2_SECRET_ACCESS_KEY
      secretKey: ACCESS_SECRET_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    creationPolicy: Owner
    name: r2-backup-credentials
    template:
      data:
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        ACCESS_SECRET_KEY: "{{ .ACCESS_SECRET_KEY }}"
        REGION: auto
