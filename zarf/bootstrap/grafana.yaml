---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: {{ .Namespace }}
spec:
  interval: 10m0s
  maxHistory: 10
  releaseName: grafana
  targetNamespace: {{ .Namespace }}
  chart:
    spec:
      chart: grafana
      version: 12.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: {{ .Namespace }}
  values:
    adminUser: admin
    adminPassword: admin
    service:
      port: 80
      targetPort: 3000
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://prometheus-server.{{ .Namespace }}.svc
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki.{{ .Namespace }}.svc:3100
            access: proxy
    grafana.ini:
      server:
        root_url: http://localhost:3000
      auth:
        disable_login_form: false
      auth.anonymous:
        enabled: true
        org_role: Viewer
