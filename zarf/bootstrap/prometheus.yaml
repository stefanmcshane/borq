apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: {{ .Namespace }}
spec:
  interval: 10m0s
  maxHistory: 10
  releaseName: prometheus
  targetNamespace: {{ .Namespace }}
  chart:
    spec:
      chart: prometheus
      version: 29.6.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: {{ .Namespace }}
  values:
    alertmanager:
      enabled: false
    nodeExporter:
      enabled: false
    pushgateway:
      enabled: false
    kube-state-metrics:
      enabled: true
    scrapeConfigs: {}
    server:
      retention: 8d
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      persistentVolume:
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      extraFlags:
      - web.enable-remote-write-receiver

