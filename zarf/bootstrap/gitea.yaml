---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: {{ .Namespace }}
spec:
  interval: 10m0s
  maxHistory: 10
  releaseName: gitea
  targetNamespace: {{ .Namespace }}
  chart:
    spec:
      chart: gitea
      version: 12.5.3
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: {{ .Namespace }}
  values:
    postgresql:
      enabled: true
      persistence:
        enabled: true
        size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    postgresql-ha:
      enabled: false
    valkey:
      enabled: false
    valkey-cluster:
      enabled: false
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
    service:
      http:
        clusterIP: ""
      ssh:
        clusterIP: ""
    gitea:
      admin:
        existingSecret: gitea-admin
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      config:
        database:
          DB_TYPE: postgres
        session:
          PROVIDER: memory
        cache:
          ADAPTER: memory
        queue:
          TYPE: level
