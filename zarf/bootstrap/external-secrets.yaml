apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: {{ .Namespace }}
spec:
  dependsOn:
    - name: cert-manager
      namespace: {{ .Namespace }}
  interval: 10m0s
  maxHistory: 10
  releaseName: external-secrets
  targetNamespace: {{ .Namespace }}
  chart:
    spec:
      chart: external-secrets
      version: 2.4.1
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: {{ .Namespace }}
  values:
    installCRDs: false
    certController:
      create: false
    webhook:
      certManager:
        enabled: true
        cert:
          create: true
          duration: 8760h0m0s
          issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: borq-selfsigned-issuer
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    serviceMonitor:
      enabled: true
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gitea-admin
  namespace: {{ .Namespace }}
spec:
  updatePolicy: "Replace"
  deletionPolicy: "None"
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-backend
  selector:
    secret:
      name: gitea-admin
  dataTo:
    - remoteKey: kv/{{ .ClusterName }}/gitea
      storeRef:
        kind: ClusterSecretStore
        name: openbao-backend
