apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: {{ .Namespace }}
spec:
  interval: 10m0s
  maxHistory: 10
  releaseName: loki
  targetNamespace: {{ .Namespace }}
  chart:
    spec:
      chart: loki
      version: 13.6.2
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: {{ .Namespace }}
  values:
    minio:
      enabled: false
    deploymentMode: Monolithic
    singleBinary:
      replicas: 1
      persistence:
        size: 10Gi
        enableStatefulSetRecreationForSizeChange: true
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 336h
    gateway:
      enabled: false
    memcached:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
      writebackSizeLimit: 10MB
    monitoring:
      serviceMonitor:
        enabled: true
        metadata:
          labels:
            release: prometheus
