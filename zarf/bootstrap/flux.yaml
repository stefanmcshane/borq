---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: {{ .Namespace }}
spec:
  interval: 10m0s
  maxHistory: 10
  releaseName: flux-operator
  targetNamespace: {{ .Namespace }}
  chart:
    spec:
      chart: flux-operator
      version: 0.48.0
      sourceRef:
        kind: HelmRepository
        name: flux-operator
        namespace: {{ .Namespace }}
---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: {{ .Namespace }}
spec:
  distribution:
    version: 2.8.x
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  sync:
    kind: GitRepository
    url: {{ .SyncUrl }}
    ref: refs/heads/main
    path: {{ .ClusterPath }}
    pullSecret: flux-system
