---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: {{ .Namespace }}
spec:
  interval: 10m0s
  maxHistory: 10
  releaseName: alloy
  targetNamespace: {{ .Namespace }}
  chart:
    spec:
      chart: alloy
      version: 1.8.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: {{ .Namespace }}
  values:
    alloy:
      config: |
        logging {
          level = "info"
          format = "logfmt"
        }
        loki.write "default" {
          endpoint {
            url = "http://loki.{{ .Namespace }}.svc:3100/loki/api/v1/push"
          }
        }
        loki.source.kubernetes "pod_logs" {
          forward_to = [loki.write.default.receiver]
        }
        prometheus.operator.servicemonitors "default" {
          forward_to = [prometheus.remote_write.default.receiver]
        }
        prometheus.scrape "kube_state_metrics" {
          targets = [{
            __address__ = "prometheus-kube-state-metrics.{{ .Namespace }}.svc:8080",
          }]
          forward_to = [prometheus.remote_write.default.receiver]
          metric_relabel {
            action        = "keep"
            source_labels = ["__name__"]
            regex         = "kube_deployment_status_replicas|kube_pod_status_ready|kube_pod_labels|kube_horizontalpodautoscaler_spec_target_metric|kube_horizontalpodautoscaler_status_current_replicas|kube_pod_container_resource_requests|kube_pod_status_phase|kube_node_labels"
          }
        }
        prometheus.remote_write "default" {
          endpoint {
            url = "http://prometheus-server.{{ .Namespace }}.svc/api/v1/write"
          }
        }
    rbac:
      rules:
        - apiGroups: ["", "discovery.k8s.io", "networking.k8s.io"]
          resources: ["endpoints", "endpointslices", "ingresses", "pods", "services"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["pods", "pods/log", "namespaces"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["monitoring.grafana.com"]
          resources: ["podlogs"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["monitoring.coreos.com"]
          resources: ["prometheusrules"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["monitoring.coreos.com"]
          resources: ["alertmanagerconfigs"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["monitoring.coreos.com"]
          resources: ["podmonitors", "servicemonitors", "probes", "scrapeconfigs"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["configmaps", "secrets"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps", "extensions"]
          resources: ["replicasets"]
          verbs: ["get", "list", "watch"]
      clusterRules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["nodes/pods"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["nodes/metrics"]
          verbs: ["get", "list", "watch"]
        - nonResourceURLs: ["/metrics"]
          verbs: ["get"]
