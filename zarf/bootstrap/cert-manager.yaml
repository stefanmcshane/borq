---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: {{ .Namespace }}
spec:
  interval: 12h
  maxHistory: 10
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    crds:
      enabled: false
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: borq-selfsigned-issuer
spec:
  selfSigned: {}
