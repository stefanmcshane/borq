---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: {{ .Namespace }}
spec:
  interval: 10m0s
  maxHistory: 10
  releaseName: openbao
  targetNamespace: {{ .Namespace }}
  chart:
    spec:
      chart: openbao
      version: 0.27.2
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: {{ .Namespace }}
  values:
    global:
      tlsDisable: true
    injector:
      enabled: false
    server:
      image:
        registry: ghcr.io
        repository: openbao/openbao
        tag: "2.4.4"
      standalone:
        enabled: true
        config: |
          ui = true
          disable_mlock = true
          api_addr = "http://openbao.{{ .Namespace }}.svc:8200"
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "file" {
            path = "/openbao/data"
          }
          telemetry {
            prometheus_retention_time = "30s"
            disable_hostname = true
          }
      dataStorage:
        enabled: true
        size: 10Gi
        mountPath: "/openbao/data"
      service:
        port: 8200
        targetPort: 8200
      readinessProbe:
        enabled: true
        path: /v1/sys/health?standbyok=true&sealedcode=200
        port: 8200
        initialDelaySeconds: 5
        periodSeconds: 5
      serviceMonitor:
        enabled: true
        interval: 30s
    ui:
      enabled: false
