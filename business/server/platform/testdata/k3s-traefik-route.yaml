apiVersion: apps/v1
kind: Deployment
metadata:
  name: existing-route
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: existing-route
  template:
    metadata:
      labels:
        app: existing-route
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: existing-route
  namespace: default
spec:
  selector:
    app: existing-route
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: existing-route
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: existing.borq.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: existing-route
                port:
                  number: 80
