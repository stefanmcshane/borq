injector:
  enabled: false
server:
  volumes:
    - name: postgres-ca
      configMap:
        name: borq-postgres-ca
        optional: true
  volumeMounts:
    - name: postgres-ca
      mountPath: /openbao/postgres-ca
      readOnly: true
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = false
      disable_mlock = true
      api_addr = "http://127.0.0.1:8200"
      cluster_addr = "https://127.0.0.1:8201"
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "raft" {
        path = "/openbao/data/raft"
        node_id = "openbao-0"
      }
  service:
    type: NodePort
    nodePort: {{ openBaoNodePort }}
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: {{ .StorageClass | quote }}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
ui:
  enabled: false
