injector:
  enabled: false
server:
  volumes:
    - name: postgres-ca
      configMap:
        name: borq-postgres-ca
        optional: true
  volumeMounts:
    - name: postgres-ca
      mountPath: /openbao/postgres-ca
      readOnly: true
  dev:
    enabled: false
  standalone:
    enabled: true
  service:
    type: NodePort
    nodePort: {{ openBaoNodePort }}
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: {{ .StorageClass | quote }}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
ui:
  enabled: false
