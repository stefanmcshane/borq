deployment:
  replicas: 1
ingressClass:
  enabled: true
  isDefaultClass: true
service:
  type: LoadBalancer
resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 192Mi

metrics:
  prometheus:
    service:
      enabled: true
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
