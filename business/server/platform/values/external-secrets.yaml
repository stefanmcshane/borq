installCRDs: true
replicaCount: 1
resources:
  requests:
    cpu: 10m
    memory: 48Mi
  limits:
    memory: 192Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
{{ if eq .Profile "dev" }}
# One namespace-scoped worker retains failure history separately for each Helm release.
extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: borq-pod-history
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: borq-pod-history
    rules:
      - apiGroups: [""]
        resources: [pods]
        verbs: [list, delete]
      - apiGroups: [apps]
        resources: [deployments, replicasets, statefulsets, daemonsets]
        verbs: [get]
      - apiGroups: [batch]
        resources: [jobs, cronjobs]
        verbs: [get]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: borq-pod-history
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: borq-pod-history
    subjects:
      - kind: ServiceAccount
        name: borq-pod-history
        namespace: {{ .Namespace | quote }}
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: borq-pod-history
    data:
      cleanup.py: {{ podHistoryScript | quote }}
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: borq-pod-history
    spec:
      schedule: "*/5 * * * *"
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 120
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 1
      jobTemplate:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 120
          template:
            metadata:
              labels:
                app.kubernetes.io/name: borq-pod-history
            spec:
              serviceAccountName: borq-pod-history
              restartPolicy: Never
              enableServiceLinks: false
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: cleanup
                  image: python:3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
                  command: [python3, -u, -B, /scripts/cleanup.py]
                  env:
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: KEEP_FAILED_PODS
                      value: "5"
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      memory: 64Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop: [ALL]
                  volumeMounts:
                    - name: script
                      mountPath: /scripts
                      readOnly: true
              volumes:
                - name: script
                  configMap:
                    name: borq-pod-history
{{ end }}
