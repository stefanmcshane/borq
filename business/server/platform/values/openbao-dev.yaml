injector:
  enabled: false
server:
  volumes:
    - name: postgres-ca
      configMap:
        name: borq-postgres-ca
        optional: true
  volumeMounts:
    - name: postgres-ca
      mountPath: /openbao/postgres-ca
      readOnly: true
  dev:
    enabled: true
    devRootToken: unused-borq-secret-overrides-this
  extraSecretEnvironmentVars:
    - envName: BAO_DEV_ROOT_TOKEN_ID
      secretName: borq-openbao-admin
      secretKey: token
  service:
    type: NodePort
    nodePort: {{ openBaoNodePort }}
  dataStorage:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
ui:
  enabled: false
