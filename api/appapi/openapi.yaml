        Restores one app from a succeeded deployment in this space as a new reviewed plan. Other apps retain their current configuration. Call ApplyPlan then poll GetOperation. Database migrations and persistent data are not reversed. Historical environment pins must still be deployable; resource deletion remains unsupported.
