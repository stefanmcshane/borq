        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
          description: Complete configuration with every default, empty list, and
            explicit zero preserved.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid, oversized, malformed, or schema-invalid request. Bodies
            must contain one document no larger than 1 MiB.
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported request Content-Type.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server failure.
      summary: Expand a partial application configuration into its complete form.
