            and returned only through the explicit kubeconfig download endpoint. Mutually exclusive with kubeconfigPath and inCluster.
          type: string
        kubeconfigPath:
          description: Server-local kubeconfig path. This API is restricted to trusted
            administrators.
          type: string
        reconcile:
          description: Schedule target component reconciliation after registration. Omission defaults to true. False only saves the registration; it does not install or enqueue components. This request option is never persisted or returned.
          type: boolean
      type: object
    ClusterTailscale:
      type: object
      additionalProperties: false
      description: This cluster's Tailscale OAuth credentials. Omit to preserve existing credentials. Converged clusters reuse the management operator and need no separate credentials.
      properties:
        clientId:
          type: string
          writeOnly: true
          description: Restricted OAuth client for this application cluster; supply together with clientSecret.
        clientSecret:
          type: string
          writeOnly: true
          description: Stored privately before accepting work, never in SQLite, responses, or Helm values.
        credentialsRef:
          type: string
          description: Existing private credential reference bound to this cluster. Mutually exclusive with inline credentials.
    LinkClusterInput:
      type: object
