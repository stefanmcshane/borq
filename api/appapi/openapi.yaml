components:
  responses:
    Unauthenticated:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated user lacks the required permission or organization access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    OrganizationRead:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires organization:read. The installation administrator retains recovery access."
      x-borq-permission: "organization:read"
    OrganizationCreate:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires organization:create. The installation administrator retains recovery access."
      x-borq-permission: "organization:create"
    OrganizationConfigure:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires organization:configure. The installation administrator retains recovery access."
      x-borq-permission: "organization:configure"
    ClusterRead:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires cluster:read. The installation administrator retains recovery access."
      x-borq-permission: "cluster:read"
    ClusterLink:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires cluster:link. The installation administrator retains recovery access."
      x-borq-permission: "cluster:link"
    ClusterConfigure:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires cluster:configure. The installation administrator retains recovery access."
      x-borq-permission: "cluster:configure"
    ClusterCredentials:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires cluster:credentials. The installation administrator retains recovery access."
      x-borq-permission: "cluster:credentials"
    SpaceRead:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires space:read. The installation administrator retains recovery access."
      x-borq-permission: "space:read"
    SpaceConfigure:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires space:configure. The installation administrator retains recovery access."
      x-borq-permission: "space:configure"
    AppRead:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires app:read. The installation administrator retains recovery access."
      x-borq-permission: "app:read"
    AppDeploy:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires app:deploy. The installation administrator retains recovery access."
      x-borq-permission: "app:deploy"
    AppDelete:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires app:delete. The installation administrator retains recovery access."
      x-borq-permission: "app:delete"
    SecretRead:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires secret:read. The installation administrator retains recovery access."
      x-borq-permission: "secret:read"
    SecretWrite:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires secret:write. The installation administrator retains recovery access."
      x-borq-permission: "secret:write"
    DatabaseRead:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires database:read. The installation administrator retains recovery access."
      x-borq-permission: "database:read"
    DatabaseConfigure:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires database:configure. The installation administrator retains recovery access."
      x-borq-permission: "database:configure"
    DatabaseRestore:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires database:restore. The installation administrator retains recovery access."
      x-borq-permission: "database:restore"
    DatabaseDelete:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires database:delete. The installation administrator retains recovery access."
      x-borq-permission: "database:delete"
    AddonRead:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires addon:read. The installation administrator retains recovery access."
      x-borq-permission: "addon:read"
    AddonConfigure:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires addon:configure. The installation administrator retains recovery access."
      x-borq-permission: "addon:configure"
    AddonDelete:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires addon:delete. The installation administrator retains recovery access."
      x-borq-permission: "addon:delete"
    ManagementRead:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires management:read. The installation administrator retains recovery access."
      x-borq-permission: "management:read"
    ManagementConfigure:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires management:configure. The installation administrator retains recovery access."
      x-borq-permission: "management:configure"
    TokenCreate:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires token:create. The installation administrator retains recovery access."
      x-borq-permission: "token:create"
    UserManage:
      type: http
      scheme: bearer
      bearerFormat: Borq token or session
      description: "Requires user:manage. The installation administrator retains recovery access."
      x-borq-permission: "user:manage"
  parameters:
    PocketIdPath:
      in: path
      name: pocketid
      required: true
      description: Managed Pocket ID name within this space.
      schema:
        x-borq-validation-message: "Pocket ID names must contain 1 to 47 lowercase letters, digits or hyphens, and start and end with a letter or digit."
        type: string
        minLength: 1
        maxLength: 47
        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
    PostgresPath:
      in: path
      name: postgres
      required: true
      description: Managed PostgreSQL name within this space.
      schema:
        x-borq-validation-message: "PostgreSQL names must contain 1 to 47 lowercase letters, digits or hyphens, and start and end with a letter or digit."
        type: string
        minLength: 1
        maxLength: 47
        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
    CustomChartPath:
      in: path
      name: customChart
      required: true
      description: CustomChart name within the selected space.
      schema:
        type: string
        minLength: 1
        maxLength: 47
        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
    OrganizationPath:
      in: path
      name: organization
      required: true
      description: Organization name from ListOrganizations.
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
    SpacePath:
      in: path
      name: space
      required: true
      description: Space name from ListSpaces; fixes the cluster and namespace.
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
    ApplicationPath:
      in: path
      name: application
      required: true
      description: Application name from ListApps, scoped to the selected space.
      schema:
        type: string
        minLength: 1
        maxLength: 50
        pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
    HistoryRange:
      in: query
      name: range
      description: History window ending now or at end. Metrics use 30s for 30m and 1h, 5m for 12h, and 30m for 3d. Older data is available only after collection has run for that long.
      schema:
        type: string
        enum: [30m, 1h, 12h, 3d]
        default: 1h
    HistoryEnd:
      in: query
      name: end
      description: Optional RFC3339 end time for a repeatable historical snapshot; omit for current data. Future times are rejected.
      schema:
        type: string
        format: date-time
  schemas:
    Permission:
      type: string
      description: A named Borq permission. Organization grants cannot confer management permissions or organization creation.
      enum: ["organization:read", "organization:create", "organization:configure", "cluster:read", "cluster:link", "cluster:configure", "cluster:credentials", "space:read", "space:configure", "app:read", "app:deploy", "app:delete", "secret:read", "secret:write", "database:read", "database:configure", "database:restore", "database:delete", "addon:read", "addon:configure", "addon:delete", "management:read", "management:configure", "token:create", "user:manage"]
    GrantedPermission:
      type: string
      description: A current grant; '*' is retained only for legacy initial-administrator wildcard grants.
      enum: ["*", "organization:read", "organization:create", "organization:configure", "cluster:read", "cluster:link", "cluster:configure", "cluster:credentials", "space:read", "space:configure", "app:read", "app:deploy", "app:delete", "secret:read", "secret:write", "database:read", "database:configure", "database:restore", "database:delete", "addon:read", "addon:configure", "addon:delete", "management:read", "management:configure", "token:create", "user:manage"]
    OrganizationMember:
      type: object
      additionalProperties: false
      required: [id, email, emailVerified, issuer, subject, roleIds, permissions, state, revision]
      properties:
        id:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
          description: Whether the identity provider verified the displayed email address.
        issuer:
          type: string
        subject:
          type: string
        roleIds:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/GrantedPermission'
        state:
          type: string
          enum: [active, disabled]
        revision:
          type: integer
          format: int64
          minimum: 1
    OrganizationMemberInput:
      type: object
      additionalProperties: false
      required: [roleIds, disabled, revision]
      properties:
        roleIds:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
        disabled:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
    OrganizationRole:
      type: object
      additionalProperties: false
      required: [id, name, permissions, revision]
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/GrantedPermission'
        revision:
          type: integer
          format: int64
          minimum: 1
    DeletedOrganizationRole:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
    OrganizationRoleInput:
      type: object
      additionalProperties: false
      required: [name, permissions, revision]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        permissions:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Use zero when creating a role and the last read revision when updating it.
    CreateApiTokenInput:
      type: object
      additionalProperties: false
      required: [permissions, expiresInSeconds]
      properties:
        permissions:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Permission'
        expiresInSeconds:
          type: integer
          minimum: 1
          maximum: 86400
    ApiToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    OrganizationPermissions:
      type: object
      additionalProperties: false
      required: [subject, permissions, revision]
      properties:
        subject:
          type: string
          minLength: 1
        permissions:
          type: array
          items:
            type: string
          maxItems: 64
          description: Complete current administrator grants. An empty array revokes all grants.
        revision:
          type: integer
          format: int64
          minimum: 1
    OrganizationOnboardingInput:
      type: object
      additionalProperties: false
      description: Optionally choose oidc, pocketId, or pocketIdOrganization and remove the other provider fields. Omit all three to use the administrator token until OIDC is configured. Pocket ID hosting is separate from bootstrap. Reuse always requires pocketIdOrganization.
      properties:
        adminEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Verified provider account allowed to administer this Borq organization with any provider. Required for external OIDC; with an explicit Pocket ID selection, omission selects its designated management administrator. Requires a provider selection. Does not create a provider account or grant Pocket ID administration.
        oidc:
          $ref: '#/components/schemas/OrganizationOidcInput'
        pocketId:
          $ref: '#/components/schemas/OrganizationPocketIdInput'
        pocketIdOrganization:
          type: string
          minLength: 1
          maxLength: 63
          description: Explicitly reuse this organization's managed Pocket ID with a separate application. adminEmail may select a different existing provider account without granting Pocket ID administration.
    OrganizationPocketId:
      type: object
      additionalProperties: false
      required: [available, state, message, issuerUrl, borqPublicUrl, certificateIssuer, adminUsername, adminEmail]
      properties:
        env:
          $ref: "#/components/schemas/EnvReference"
          description: Selected management secret group and its concrete publication number.
        available:
          type: boolean
        state:
          type: string
          description: Empty before setup, otherwise queued, provisioning, ready, or failed.
        message:
          type: string
        issuerUrl:
          type: string
        borqPublicUrl:
          x-go-name: BaseURL
          type: string
        certificateIssuer:
          type: string
        adminUsername:
          type: string
        adminEmail:
          type: string
    OrganizationPocketIdAdminEnrollment:
      type: object
      additionalProperties: false
      required: [enrolled]
      properties:
        enrolled:
          type: boolean
          description: The configured administrator already has a passkey; no enrollment credential was issued.
        url:
          type: string
          format: uri
          description: Short-lived single-use passkey enrollment URL. Treat as a credential; do not cache or persist.
    OrganizationPocketIdInput:
      type: object
      additionalProperties: false
      required: [issuerUrl, borqPublicUrl, certificateIssuer, adminEmail, oidcRevision]
      properties:
        configuration:
          type: object
          additionalProperties:
            type: string
          description: Complete editable Pocket ID environment. Omit to preserve; an empty object removes overrides. Mutually exclusive with env. Values are stored privately in management OpenBao.
        configurationRevision:
          type: string
          description: Revision from the privileged configuration read, required when configuration is supplied.
        configurationBaseVersion:
          type: integer
          minimum: 0
          description: Secret publication base from the configuration read; protects concurrent edits.
        env:
          $ref: "#/components/schemas/ManagementEnvReference"
          description: Management secret group in the owning organization. Omit to preserve the binding; latest is resolved once when setup is accepted.
        issuerUrl:
          type: string
          minLength: 1
          maxLength: 2048
        borqPublicUrl:
          x-go-name: BaseURL
          type: string
          minLength: 1
          maxLength: 2048
        certificateIssuer:
          type: string
          maxLength: 253
        adminUsername:
          description: Defaults to a compatible email username or stable internal alias. Explicit names are retained for existing installations and declarative compatibility.
          type: string
          minLength: 1
          maxLength: 50
        adminEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Management-designated administrator of the whole Pocket ID instance. This is separate from OrganizationOnboardingInput.adminEmail, which grants only Borq organization access.
        oidcRevision:
          type: integer
          format: int64
          minimum: 0
    OrganizationPocketIdConfiguration:
      type: object
      additionalProperties: false
      required: [values, managed, revision, baseVersion, certificateIssuers, defaultCertificateIssuer]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
          description: Effective editable environment, including secret values. Trusted administrators only.
        managed:
          type: object
          additionalProperties:
            type: string
          description: Runtime settings controlled by Borq; generated keys are never returned.
        revision:
          type: string
        baseVersion:
          type: integer
          minimum: 0
        certificateIssuers:
          type: array
          items:
            type: string
        defaultCertificateIssuer:
          type: string
    OrganizationOidc:
      type: object
      additionalProperties: false
      required: [adminEmail, issuerUrl, clientId, borqPublicUrl, callbackUrl, logoutCallbackUrl, clientSecretConfigured, revision, lastTestedAt]
      properties:
        adminEmail:
          type: string
        issuerUrl:
          type: string
        clientId:
          type: string
        borqPublicUrl:
          x-go-name: BaseURL
          type: string
        callbackUrl:
          type: string
          description: Generated callback URL bound to this organization and issuer.
        logoutCallbackUrl:
          type: string
          readOnly: true
          description: Post-logout return URL to register at the provider, derived from the Borq public URL and ending in /login.
        callbackUrls:
          type: array
          readOnly: true
          x-go-type-skip-optional-pointer: true
          description: All public and observed private callback URLs to register with the provider.
          items:
            type: string
        logoutCallbackUrls:
          type: array
          readOnly: true
          x-go-type-skip-optional-pointer: true
          description: Corresponding post-logout return URLs for both configured origins.
          items:
            type: string
        clientSecretConfigured:
          type: boolean
        revision:
          type: integer
          format: int64
        lastTestedAt:
          type: string
          description: RFC3339 time of the last successful sign-in test; empty before testing this configuration.
    OrganizationOidcInput:
      type: object
      additionalProperties: false
      required: [issuerUrl, clientId, borqPublicUrl, revision]
      properties:
        adminEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Provider account selected for organization administration. Required when saving OIDC settings; organization onboarding supplies its top-level adminEmail.
        issuerUrl:
          type: string
          minLength: 1
          maxLength: 2048
        clientId:
          type: string
          minLength: 1
          maxLength: 1024
        clientSecret:
          type: string
          maxLength: 8192
          writeOnly: true
          description: Omit to retain the saved secret for the same issuer and client ID.
        borqPublicUrl:
          x-go-name: BaseURL
          type: string
          minLength: 1
          maxLength: 2048
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Last read revision, or zero for initial setup.
    OrganizationOidcAdministratorInput:
      type: object
      additionalProperties: false
      required: [subject, revision]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: Exact Account ID from Borq's successful Test sign-in, not an email or Microsoft directory object ID.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Last read OIDC settings revision.
    PocketIdInput:
      type: object
      additionalProperties: false
      x-borq-validation-message: "Pocket ID settings must use supported configuration fields. Credentials are generated automatically."
      properties:
        issuerUrl:
          type: string
          description: "Stable public HTTPS URL used by passkeys and OpenID Connect clients."
        adminUsername:
          type: string
          description: "Initial administrator username; omission selects admin."
        adminEmail:
          type: string
          description: "Email address of the initial administrator."
        storage:
          type: string
          description: "SQLite data volume capacity; omission selects 1Gi."
        storageClass:
          type: string
          description: "Storage class providing ReadWriteOnce block storage and local filesystem locking."
        image:
          type: string
          description: "Pinned Pocket ID container image; omission selects the tested default."
        certificateIssuer:
          type: string
          description: "Certificate issuer; omission uses the owning space issuer."
    NamedPocketId:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 47
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          x-borq-validation-message: "Pocket ID names must contain 1 to 47 lowercase letters, digits or hyphens, and start and end with a letter or digit."
        issuerUrl:
          type: string
          description: "Stable public HTTPS URL used by passkeys and OpenID Connect clients."
        adminUsername:
          type: string
          description: "Initial administrator username; omission selects admin."
        adminEmail:
          type: string
          description: "Email address of the initial administrator."
        storage:
          type: string
          description: "SQLite data volume capacity; omission selects 1Gi."
        storageClass:
          type: string
          description: "Storage class providing ReadWriteOnce block storage and local filesystem locking."
        image:
          type: string
          description: "Pinned Pocket ID container image; omission selects the tested default."
        certificateIssuer:
          type: string
          description: "Certificate issuer; omission uses the owning space issuer."
    PocketId:
      type: object
      additionalProperties: false
      required: [id, name, namespace, specification, state, message, operation, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 47
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          x-borq-validation-message: "Pocket ID names must contain 1 to 47 lowercase letters, digits or hyphens, and start and end with a letter or digit."
        namespace:
          type: string
        specification:
          $ref: '#/components/schemas/PocketIdInput'
        state:
          type: string
        message:
          type: string
        operation:
          type: string
        updatedAt:
          type: string
          format: date-time
    PocketIdEnrollment:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          description: Single-use administrator enrollment URL; treat as a credential.
    PostgresInput:
      x-borq-validation-message: "PostgreSQL settings must use supported configuration fields. Passwords are generated automatically."
      type: "object"
      additionalProperties: false
      properties:
        instances:
          x-borq-validation-message: "PostgreSQL instances must be an integer between 1 and 16."
          type: "integer"
          description: "Instances is the number of PostgreSQL instances; omission selects one."
          minimum: 1
          maximum: 16
        storage:
          x-borq-validation-message: "PostgreSQL storage must be a positive Kubernetes quantity string."
          type: "string"
          description: "Storage is the capacity of each instance; omission selects 1Gi."
        storageClass:
          x-borq-validation-message: "PostgreSQL storageClass must be a string."
          type: "string"
          description: "StorageClass selects the persistent storage driver."
        image:
          x-borq-validation-message: "PostgreSQL image must be a string pinning a supported 14–18 major and exact minor tag."
          type: "string"
          description: "Image pins the PostgreSQL operand; omission selects the tested default."
        database:
          x-borq-validation-message: "PostgreSQL database must be a lowercase SQL identifier string."
          type: "string"
          description: "Database is the initial application database; omission selects app."
        username:
          x-borq-validation-message: "PostgreSQL username must be a lowercase SQL identifier string; postgres and borq_openbao are reserved."
          type: "string"
          description: "Username is the application role; omission selects app."
        credentials:
          $ref: "#/components/schemas/PostgresCredentialPolicy"
        resources:
          $ref: "#/components/schemas/PostgresResources"
          description: "Resources sets Kubernetes resource requests and limits."
        backup:
          $ref: "#/components/schemas/PostgresBackupPolicy"
          description: "Backup configures backups and mandatory recovery verification."
    PostgresCredentialPolicy:
      type: "object"
      additionalProperties: false
      properties:
        rotationPeriod:
          type: "string"
          description: "OpenBao password rotation duration, defaults to 720h (30 days); between 1m and 720h."
        host:
          type: "string"
          description: "Private SQL hostname reachable from management OpenBao; defaults to the target-local database Service."
        port:
          type: "integer"
          minimum: 1
          maximum: 65535
          description: "Management SQL port, defaults to 5432."
    PostgresBackupPolicy:
      x-borq-validation-message: "PostgreSQL backup settings must use supported configuration fields."
      type: "object"
      additionalProperties: false
      properties:
        enabled:
          x-borq-validation-message: "PostgreSQL backup enabled must be a boolean."
          type: "boolean"
          description: "Enable backups and mandatory restore tests; omitted on creation selects true."
        restoreCheck:
          $ref: "#/components/schemas/PostgresRestoreCheckInput"
        schedule:
          x-borq-validation-message: "PostgreSQL backup schedule must be a five-field UTC cron string."
          type: "string"
          description: "Five-field UTC cron schedule; omitted selects daily at midnight."
        recoveryWindowDays:
          x-borq-validation-message: "PostgreSQL recoveryWindowDays must be an integer between 1 and 3650."
          type: "integer"
          description: "RecoveryWindowDays retains a recovery window; omission selects 30 days."
    PostgresResources:
      x-borq-validation-message: "PostgreSQL resources must contain requests or limits for cpu and memory."
      type: "object"
      additionalProperties: false
      properties:
        requests:
          x-borq-validation-message: "PostgreSQL resource requests must be an object of quantity strings for cpu and memory."
          type: "object"
          additionalProperties:
            x-borq-validation-message: "PostgreSQL resource quantities must be strings for cpu and memory."
            type: "string"
          description: "Requests reserves CPU and memory."
        limits:
          x-borq-validation-message: "PostgreSQL resource limits must be an object of quantity strings for cpu and memory."
          type: "object"
          additionalProperties:
            x-borq-validation-message: "PostgreSQL resource quantities must be strings for cpu and memory."
            type: "string"
          description: "Limits caps CPU and memory."
    PostgresRestoreCheckInput:
      x-borq-validation-message: "PostgreSQL restoreCheck settings must use supported configuration fields."
      type: "object"
      additionalProperties: false
      properties:
        schedule:
          x-borq-validation-message: "PostgreSQL restoreCheck schedule must be a five-field UTC cron string."
          type: "string"
          description: "Schedule is a five-field UTC cron expression; omission selects Sunday at 03:00."
        timeoutSeconds:
          x-borq-validation-message: "PostgreSQL restoreCheck timeoutSeconds must be an integer between 60 and 86400."
          type: "integer"
          description: "TimeoutSeconds bounds the complete verification and cleanup workflow."
        resources:
          $ref: "#/components/schemas/PostgresResources"
          description: "Resources constrains the temporary recovered database."
    Postgres:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          description: "ID changes for every new incarnation, including reuse of a deleted name."
        name:
          type: "string"
          description: "Name identifies this managed addon within its space."
          x-borq-validation-message: "PostgreSQL names must contain 1 to 47 lowercase letters, digits or hyphens, and start and end with a letter or digit."
          minLength: 1
          maxLength: 47
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
        specification:
          $ref: "#/components/schemas/PostgresInput"
          description: "Specification is normalized accepted configuration."
        namespace:
          type: "string"
          description: "Namespace is the fixed namespace of its owning space."
        clusterName:
          type: "string"
          description: "ClusterName is the isolated Kubernetes PostgreSQL cluster identity."
        environmentGroup:
          type: "string"
          description: "Secret group containing this database incarnation's connection values."
        state:
          type: "string"
          description: "State is pending, ready, failed, deleting, or removed."
        message:
          type: "string"
          description: "Message explains the latest durable operation outcome."
        operation:
          type: "string"
          description: "Operation identifies the latest accepted operation."
        protection:
          $ref: "#/components/schemas/PostgresProtection"
          description: "Protection reports observed backup and restore-test health."
        restoreCheck:
          $ref: "#/components/schemas/PostgresRestoreCheck"
          description: "RestoreCheck reports the latest isolated verification outcome."
        updatedAt:
          type: "string"
          format: "date-time"
          description: "UpdatedAt is the latest accepted or completed state transition."
      required:
        - "id"
        - "name"
        - "specification"
        - "namespace"
        - "clusterName"
        - "environmentGroup"
        - "state"
        - "message"
        - "operation"
        - "protection"
        - "restoreCheck"
        - "updatedAt"
    PostgresProtection:
      type: "object"
      additionalProperties: false
      properties:
        status:
          type: "string"
          description: "Protection is disabled, pending, unverified, ready, or degraded."
        message:
          type: "string"
          description: "Message explains protection degradation separately from database readiness."
        lastBackupAt:
          type: "string"
          format: "date-time"
          description: "LastBackupAt is the last observed completed backup."
        lastTestAt:
          type: "string"
          format: "date-time"
          description: "Last successful restore test of the current archive."
        recoveryWindowDays:
          type: "integer"
          description: "RecoveryWindowDays is the minimum configured recovery retention window."
      required:
        - "status"
        - "message"
        - "recoveryWindowDays"
    PostgresRestoreCheck:
      type: "object"
      additionalProperties: false
      properties:
        status:
          type: "string"
          description: "Status is never, pending, running, succeeded, or failed."
        operation:
          type: "string"
          description: "Operation identifies the durable verification task."
        message:
          type: "string"
          description: "Message describes the SQL verification result without credentials."
        cleanup:
          type: "string"
          description: "Cleanup reports pending, succeeded, or failed resource cleanup."
        startedAt:
          type: "string"
          format: "date-time"
          description: "StartedAt is the original attempt start."
        completedAt:
          type: "string"
          format: "date-time"
          description: "CompletedAt is the verification completion time."
        durationSeconds:
          type: "number"
          description: "DurationSeconds measures the complete recovery verification."
      required:
        - "status"
    PostgresBackup:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          description: "ID is an opaque Borq catalogue identity, never a freely supplied object key."
        archiveId:
          type: "string"
          description: "ArchiveID identifies an immutable source archive."
        sourceId:
          type: "string"
          description: "SourceID is the immutable original PostgreSQL incarnation."
        sourceName:
          type: "string"
          description: "SourceName is the friendly source name retained after deletion."
        backupId:
          type: "string"
          description: "BackupID is Barman's physical backup identity."
        completedAt:
          type: "string"
          format: "date-time"
          description: "CompletedAt records the physical backup completion."
        majorVersion:
          type: "integer"
          description: "MajorVersion is the PostgreSQL physical format major."
        sizeBytes:
          type: "integer"
          description: "SizeBytes is the physical backup size."
        recoveryStart:
          type: "string"
          format: "date-time"
          description: "RecoveryStart is the earliest safe target for this base backup."
        recoveryEnd:
          type: "string"
          format: "date-time"
          description: "RecoveryEnd is the latest conservatively confirmed time from completed backup metadata. Newer archived WAL can be recovered; PostgreSQL verifies requested targets."
        eligible:
          type: "boolean"
          description: "Eligible means the metadata is complete and compatible."
        reason:
          type: "string"
          description: "Reason explains rejection or recovery bounds."
      required:
        - "id"
        - "archiveId"
        - "sourceId"
        - "sourceName"
        - "backupId"
        - "completedAt"
        - "majorVersion"
        - "sizeBytes"
        - "recoveryStart"
        - "recoveryEnd"
        - "eligible"
    PostgresRestoreInput:
      x-borq-validation-message: "PostgreSQL restore requires a non-empty backupId and an optional RFC3339 recoveryTarget."
      type: "object"
      additionalProperties: false
      properties:
        backupId:
          x-borq-validation-message: "PostgreSQL restore backupId must be a non-empty approved backup ID string."
          type: "string"
          description: "BackupID selects an opaque entry returned by ListPostgresBackups."
          minLength: 1
        recoveryTarget:
          x-borq-validation-message: "PostgreSQL recoveryTarget must be an RFC3339 date-time string."
          type: "string"
          format: "date-time"
          description: "RecoveryTarget optionally requests a UTC point in time after the selected backup. PostgreSQL must reach it using archived WAL; omission replays to the latest available archived transaction."
        specification:
          $ref: "#/components/schemas/PostgresInput"
          description: "Specification sets destination sizing and verification policy."
      required:
        - "backupId"
    PostgresMetrics:
      type: "object"
      additionalProperties: false
      properties:
        activityAvailable:
          type: "boolean"
          description: "Whether SQL activity and database size were observed."
        usage:
          $ref: "#/components/schemas/AppMetrics"
          description: "Usage contains CPU and memory history."
        diskBytes:
          type: "integer"
          description: "DiskBytes is current database size measured by PostgreSQL."
        diskAvailable:
          type: "boolean"
          description: "DiskAvailable indicates whether volume capacity and usage were observed."
        diskUsedBytes:
          type: "integer"
          description: "DiskUsedBytes is observed storage use across the PostgreSQL volumes."
        diskCapacityBytes:
          type: "integer"
          description: "DiskCapacityBytes is observed total capacity across those volumes."
        diskAvailableBytes:
          type: "integer"
          description: "DiskAvailableBytes is observed remaining capacity across those volumes."
        connections:
          type: "integer"
          description: "Connections is the current number of connected sessions."
        activeQueries:
          type: "integer"
          description: "ActiveQueries is the current number of non-idle sessions."
        transactions:
          type: "integer"
          description: "Transactions is committed plus rolled back transactions since statistics reset."
        protection:
          $ref: "#/components/schemas/PostgresProtection"
          description: "Protection separates backup health from database resource use."
        notice:
          type: "string"
          description: "Notice explains unavailable portions without substituting zero observations."
      required:
        - "usage"
        - "activityAvailable"
        - "diskBytes"
        - "diskAvailable"
        - "diskUsedBytes"
        - "diskCapacityBytes"
        - "diskAvailableBytes"
        - "connections"
        - "activeQueries"
        - "transactions"
        - "protection"
    PostgresCheckInput:
      type: "object"
      additionalProperties: false
      properties:
        jobUid:
          type: "string"
          description: "JobUID binds idempotent acceptance to one live Job owned by the resource CronJob."
      required:
        - "jobUid"
    PostgresEnv:
      type: "object"
      additionalProperties: false
      required:
        - "PGHOST"
        - "PGPORT"
        - "PGDATABASE"
        - "PGUSER"
        - "PGPASSWORD"
        - "DATABASE_URL"
      properties:
        PGHOST:
          type: "string"
        PGPORT:
          type: "string"
        PGDATABASE:
          type: "string"
        PGUSER:
          type: "string"
        PGPASSWORD:
          type: "string"
        DATABASE_URL:
          type: "string"
    ManagementS3Input:
      type: "object"
      description: "Primary S3-compatible storage for management backups and PostgreSQL archives. Defaults to persistent RustFS. Configure the external Restic destination separately with ManagementConfiguration.offsite."
      additionalProperties: false
      properties:
        endpoint:
          type: "string"
          description: "Endpoint is the S3-compatible HTTP(S) origin."
        region:
          type: "string"
          description: "Region is the S3 signing region."
        bucket:
          type: "string"
          description: "Bucket contains management backups and PostgreSQL archives."
        prefix:
          type: "string"
          description: "Prefix contains management backups and managed-addon archives within the bucket."
        pathStyle:
          type: "boolean"
          description: "PathStyle enables compatible S3 bucket paths."
        accessKey:
          type: "string"
          description: "AccessKey is accepted only at the input boundary and moved into OpenBao."
          writeOnly: true
        secretKey:
          type: "string"
          description: "SecretKey is accepted only at the input boundary and moved into OpenBao."
          writeOnly: true
        sessionToken:
          type: "string"
          description: "SessionToken optionally supplies temporary credentials."
          writeOnly: true
        credentialsRef:
          type: "string"
          description: "CredentialsRef selects an immutable management-vault credential document."
      required:
        - "region"
        - "bucket"
        - "pathStyle"
    ManagementS3:
      type: "object"
      description: "Primary backup archive storage coordinates and a credential reference. Restic offsite backups have a separate external S3 destination and credentials."
      additionalProperties: false
      properties:
        endpoint:
          type: "string"
          description: "Endpoint is the configured S3 origin."
        region:
          type: "string"
          description: "Region is the S3 signing region."
        bucket:
          type: "string"
          description: "Bucket contains management backups and granted organizations' PostgreSQL archives."
        prefix:
          type: "string"
          description: "Prefix is the management backup and managed-addon archive root."
        pathStyle:
          type: "boolean"
          description: "PathStyle selects path-style bucket addressing."
        credentialsRef:
          type: "string"
          description: "CredentialsRef points to an immutable OpenBao document and contains no key material."
      required:
        - "region"
        - "bucket"
        - "pathStyle"
        - "credentialsRef"
    RegistryAuth:
      type: object
      additionalProperties: false
      properties:
        server:
          type: string
          description: Registry host or HTTP(S) URL, independent of the secret name. Omitted only for legacy ghcr.io entries or an existing credentialsRef.
        username:
          type: string
          writeOnly: true
          description: Registry username; required with a password or access token.
        token:
          type: string
          writeOnly: true
          description: Registry password or access token. Staged into OpenBao before queuing work; never returned or saved in SQLite.
        credentialsRef:
          type: string
          description: Immutable OpenBao reference bound to this management installation or space. Mutually exclusive with username and token.
    Registries:
      type: object
      description: Named Docker/OCI registry credentials. Secret names are independent of registry addresses; legacy ghcr.io entries remain supported.
      additionalProperties:
        $ref: '#/components/schemas/RegistryAuth'
    ManagementDestroyIdentity:
      type: object
      description: "Immutable Kubernetes identity and ownership fence for a planned resource."
      required: [group, version, resource, kind, namespace, name, uid, resourceVersion, ownershipHash]
      properties:
        group:
          type: string
        version:
          type: string
        resource:
          type: string
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
        uid:
          type: string
        resourceVersion:
          type: string
        ownershipHash:
          type: string
    ManagementDestroyAction:
      type: object
      required: [action, kind, namespace, name]
      properties:
        action:
          type: string
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
    ManagementDestroyPlan:
      type: object
      description: "Server-owned safe detach plan. Server objects are retained until the CLI validates the completed Kubernetes receipt. Data and shared infrastructure remain."
      required: [namespace, namespaceUid, clusterUid, server, resources, dependencies, actions, retained, executed]
      properties:
        namespace:
          type: string
        namespaceUid:
          type: string
        clusterUid:
          type: string
        server:
          type: array
          items:
            $ref: "#/components/schemas/ManagementDestroyIdentity"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ManagementDestroyIdentity"
        dependencies:
          description: "Retained Kubernetes identities and content hashes that freeze provider cleanup scope. Credential values are never included."
          type: array
          items:
            $ref: "#/components/schemas/ManagementDestroyIdentity"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ManagementDestroyAction"
        retained:
          type: array
          items:
            type: string
        executed:
          type: boolean
    ManagementDestroyStatus:
      type: object
      required: [operation, plan]
      properties:
        operation:
          $ref: "#/components/schemas/Operation"
        plan:
          $ref: "#/components/schemas/ManagementDestroyPlan"
    ManagementConfiguration:
      type: "object"
      additionalProperties: false
      properties:
        borqPublicUrl:
          type: string
          description: Explicit public Borq origin used to provision its route and DNS and inherited by organization sign-in callbacks.
        network:
          $ref: '#/components/schemas/ManagementNetwork'
          description: Cluster-wide Tailscale and Cloudflare integrations reconciled by management apply. Omitted integrations retain their installed settings. Credentials are explicitly declared here and staged privately before the operation is saved.
        registries:
          $ref: '#/components/schemas/Registries'
          description: Named Docker/OCI image pull authentication for this scope. Omit to preserve it; inline credentials are stored only in OpenBao and ESO projects namespace-local pull secrets.
        components:
          type: "object"
          additionalProperties:
            $ref: "#/components/schemas/ComponentOverride"
          description: "Components overrides known management and target Helm components by name."
        s3:
          $ref: "#/components/schemas/ManagementS3Input"
          description: "Primary backup archive storage, defaulting to persistent RustFS. Omit to keep the current connection. Configure the external Restic destination with offsite."
        backups:
          $ref: "#/components/schemas/ManagementBackupInput"
          description: "Schedule independent encrypted SQLite and OpenBao captures into the primary S3 archive storage. Omit to keep the current policy."
        offsite:
          $ref: "#/components/schemas/ManagementOffsiteInput"
          description: "Schedule encrypted incremental Restic exports of completed management backups and PostgreSQL archives to a separate external S3 repository. Omit to keep the current policy."
        secretGroups:
          type: array
          items:
            $ref: "#/components/schemas/ManagementSecretGroup"
          description: Versioned management secret groups. Inline data is stored only in OpenBao before acceptance; exports contain version references.
        organizations:
          type: "array"
          items:
            $ref: "#/components/schemas/ManagementOrganization"
          description: "Organizations updates the named organization hierarchy."
    ManagementNetwork:
      type: object
      additionalProperties: false
      properties:
        managementUrl:
          type: string
          readOnly: true
          description: Observed private Tailscale HTTPS address after network reconciliation.
        tailscale:
          $ref: '#/components/schemas/ManagementTailscale'
        cloudflare:
          $ref: '#/components/schemas/ManagementCloudflare'
    ManagementTailscale:
      type: object
      additionalProperties: false
      description: Install one Tailscale operator per physical cluster. Private endpoints become available after connectivity checks pass.
      properties:
        clientId:
          type: string
          writeOnly: true
          description: Explicit Tailscale OAuth client ID. Staged privately with clientSecret; exports contain only credentialsRef.
        clientSecret:
          type: string
          writeOnly: true
          description: Explicit Tailscale OAuth secret, staged privately before accepting the operation.
        credentialsRef:
          type: string
          description: Reuse the installed management-owned credential receipt. Mutually exclusive with inline credentials.
        managementHostname:
          type: string
          description: Optional short hostname; defaults to borq- followed by the management cluster name.
        managementOperatorTag:
          type: string
        adminTag:
          type: string
        brokerTag:
          type: string
          deprecated: true
          description: Ignored compatibility field from the retired Borq DNS01 broker.
        operatorTag:
          type: string
        proxyTag:
          type: string
    ManagementCloudflare:
      type: object
      additionalProperties: false
      required: [wildcardDomain, zoneId, acmeEmail]
      description: Manage management public DNS and Let's Encrypt DNS01 certificates through cert-manager's built-in Cloudflare solver. Cloudflare credentials stay in management. Tailscale configures private administration independently.
      properties:
        apiToken:
          type: string
          writeOnly: true
          description: Explicit Cloudflare API token, staged privately before accepting the operation.
        credentialsRef:
          type: string
          description: Reuse the installed management-owned credential receipt. Mutually exclusive with apiToken.
        exposure:
          type: string
          enum: [tunnel, direct]
          description: Management ingress route. Tunnel publishes the installation's tunnel CNAME; direct publishes its public Gateway address or directTarget. Omission preserves compatibility with tunnel.enabled. A pending tunnel never falls back to a public load balancer. Separate application clusters retain their own Gateway targets.
        directTarget:
          type: string
          description: Optional static public IP or load-balancer hostname for direct management exposure. Omit to observe the Gateway address. Invalid in tunnel mode; this field does not provision a load balancer or forward inbound ports.
        tunnel:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled:
              type: boolean
            image:
              type: string
        wildcardDomain:
          type: string
          description: Public management wildcard and DNS01 scope. Both '*.example.test.com' and 'example.test.com' mean '*.example.test.com'.
        zoneId:
          type: string
        acmeEmail:
          type: string
        webhookImage:
          type: string
          deprecated: true
          description: Ignored compatibility field. Native Cloudflare DNS01 needs no Borq webhook image.
    ManagementBackupCoverage:
      type: object
      additionalProperties: false
      properties:
        checkedAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [available, attention]
        components:
          type: array
          items:
            $ref: '#/components/schemas/BackupCoverageComponent'
      required: [checkedAt, state, components]
    BackupCoverageComponent:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
        name:
          type: string
        state:
          type: string
          enum: [available, disabled, missing, stale, failed, unknown]
        lastSuccess:
          type: string
          format: date-time
        staleAfter:
          type: string
          format: date-time
        message:
          type: string
      required: [kind, name, state, message]
    ManagementBackupInput:
      type: object
      description: "Local management backup policy. SQLite and OpenBao captures use the primary S3 archive storage and run independently of Restic offsite exports."
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        interval:
          type: string
        keepLast:
          type: integer
        encryptionKey:
          type: string
          readOnly: true
          description: Managed public archive key. Borq derives its private identity from the OpenBao auto-unseal key in the management recovery file; no separate key is supplied.
        recipient:
          type: string
          deprecated: true
          writeOnly: true
          description: Legacy public-key field. New captures always use the managed encryption key.
        status:
          allOf:
          - $ref: '#/components/schemas/ManagementBackupStatus'
          readOnly: true
      required: [enabled]
    ManagementBackupStatus:
      type: object
      additionalProperties: false
      properties:
        lastAttempt:
          type: string
          format: date-time
        nextAttempt:
          type: string
          format: date-time
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ManagementBackupComponent'
      required: [components]
    ManagementBackupComponent:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
        lastAttempt:
          type: string
          format: date-time
        lastSuccess:
          type: string
          format: date-time
        storage:
          $ref: '#/components/schemas/ManagementS3'
        artifact:
          $ref: '#/components/schemas/ManagementNativeArtifact'
        error:
          type: string
      required: [state, artifact, storage]
    ManagementNativeArtifact:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
        kind:
          type: string
        id:
          type: string
        capturedAt:
          type: string
          format: date-time
        recipient:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
      required: [version, kind, id, capturedAt, recipient, size, sha256]
    ManagementOffsiteInput:
      type: object
      description: "Offsite backup policy for encrypted incremental Restic snapshots on external S3. Includes completed SQLite and OpenBao backups and managed PostgreSQL archives. Retain the Restic password and provider credentials outside Borq for independent recovery."
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        repository:
          type: string
          description: "External Restic repository in s3:https://endpoint/bucket/prefix form, separate from the primary archive storage."
        region:
          type: string
        interval:
          type: string
        keepLast:
          type: integer
        credentialsRef:
          type: string
        password:
          type: string
          description: "Restic repository password. Keep an independent recovery copy outside Borq. Stored privately in OpenBao and omitted from exports."
          writeOnly: true
        accessKey:
          type: string
          writeOnly: true
        secretKey:
          type: string
          writeOnly: true
        sessionToken:
          type: string
          writeOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ManagementOffsiteStatus'
          readOnly: true
      required: [enabled]
    ManagementOffsiteStatus:
      type: object
      description: "Restic offsite export progress and the last successful snapshot. Local backup capture has separate status under backups."
      additionalProperties: false
      properties:
        state:
          type: string
        lastAttempt:
          type: string
          format: date-time
        lastSuccess:
          type: string
          format: date-time
        nextAttempt:
          type: string
          format: date-time
        snapshotId:
          type: string
        source:
          type: string
        repository:
          type: string
        credentialsRef:
          type: string
        policyRevision:
          type: integer
          format: int64
        error:
          type: string
      required: [state]
    ManagementOrganization:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          description: "Name identifies an existing or new organization."
        managedAddons:
          type: "boolean"
          description: "ManagedAddons explicitly grants or revokes shared S3 usage. A pointer preserves omission."
        oidc:
          $ref: '#/components/schemas/ManagementOidc'
          description: Existing external identity provider. Mutually exclusive with managedPocketId; omission preserves identity configuration.
        managedPocketId:
          $ref: '#/components/schemas/ManagementPocketId'
          description: Dedicated Pocket ID reconciled in the management namespace for this organization. Mutually exclusive with oidc.
        clusters:
          type: "array"
          items:
            $ref: "#/components/schemas/ManagementClusterInput"
        spaces:
          type: "array"
          items:
            $ref: "#/components/schemas/ManagementSpace"
          description: "Spaces updates named spaces without deleting omitted ones."
      required:
        - "name"
    ManagementOidc:
      type: object
      additionalProperties: false
      required: [adminEmail]
      description: External provider configuration for organization sign-in. Use managedPocketId instead to provision a dedicated provider.
      properties:
        adminEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Existing provider account allowed to administer this Borq organization, required for every external provider configuration. Grants no administration in the external provider.
        adminSubject:
          type: string
          minLength: 1
          maxLength: 255
          description: Exact Account ID from Borq's successful Test sign-in. Explicitly enrolls the first administrator at the configured issuer without trusting email ownership; cannot replace an existing identity or restore revoked access.
        issuerUrl:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
          description: Staged in OpenBao before queuing. Omit to retain the unchanged provider's credential.
        clientSecretRef:
          type: string
          description: Immutable OpenBao credential reference owned by this organization. Mutually exclusive with clientSecret.
        borqPublicUrl:
          x-go-name: BaseURL
          type: string
          description: Public Borq origin without a path. Borq generates an organization-specific callback.
    ManagementEnvReference:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Management secret group owned by this organization.
        version:
          type: string
          description: Positive publication number or latest. Omit for latest; resolved once when setup is accepted.
    ManagementSecretGroup:
      type: object
      additionalProperties: false
      required: [organization, name]
      properties:
        organization:
          type: string
          description: Owning organization declared in this document.
        name:
          type: string
        data:
          type: object
          additionalProperties:
