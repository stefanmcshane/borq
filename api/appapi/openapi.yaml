          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      summary: Download the registered cluster's selected kubeconfig.
      description: Explicitly returns credentials to trusted administrators. The response is never cached. Lists and registration responses omit credentials. Permissions will be refined separately.
  /api/v1/organizations/{organization}/clusters/{cluster}/components:
