          type: string
          description: Explains missing or partial usage measurements without hiding node and pod health.
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ClusterNodeMetrics'
        pods:
          $ref: '#/components/schemas/ClusterPodMetrics'
    ClusterNodeMetrics:
      type: object
      additionalProperties: false
      required: [name, ready, unschedulable, conditions, cpuAllocatableCores, memoryAllocatableBytes, diskCapacityAvailable, diskCapacityBytes, diskAllocatableBytes, diskUsageAvailable, diskUsageBytes, diskUsageCapacityBytes, diskUsageObservedAt, podCapacity, usageAvailable, cpuUsageCores, memoryUsageBytes, usageObservedAt]
      properties:
        name:
          type: string
        ready:
          type: boolean
        unschedulable:
          type: boolean
        conditions:
          type: array
          items:
            type: string
        cpuAllocatableCores:
          type: number
          format: double
          description: CPU available to pods, in cores.
        memoryAllocatableBytes:
          type: integer
          format: int64
        diskCapacityAvailable:
          type: boolean
          description: True when the node reports valid local ephemeral storage capacity and allocatable values.
        diskCapacityBytes:
          type: integer
          format: int64
          description: Total node ephemeral storage capacity in bytes; excludes persistent volumes. Meaningful only when diskCapacityAvailable is true.
        diskAllocatableBytes:
          type: integer
          format: int64
          description: Ephemeral storage capacity available to pods, not current free space. Meaningful only when diskCapacityAvailable is true.
        diskUsageAvailable:
          type: boolean
          description: True when the selected node's kubelet reports valid filesystem usage and capacity within the past five minutes. Missing usage must not be displayed as zero.
        diskUsageBytes:
          type: integer
          format: int64
          description: Used bytes on the node filesystem; meaningful only when diskUsageAvailable is true.
        diskUsageCapacityBytes:
          type: integer
          format: int64
          description: Total bytes from the same kubelet filesystem sample as diskUsageBytes; the denominator for disk usage percentage.
        diskUsageObservedAt:
          type: string
          format: date-time
          description: Kubelet filesystem sample timestamp; meaningful only when diskUsageAvailable is true.
        podCapacity:
          type: integer
          format: int64
        usageAvailable:
          type: boolean
          description: True only when both CPU and memory have valid measurements within the past five minutes. Missing usage must not be displayed as zero.
        cpuUsageCores:
          type: number
          format: double
        memoryUsageBytes:
          type: integer
          format: int64
        usageObservedAt:
          type: string
          format: date-time
          description: Oldest source sample timestamp used for Prometheus CPU and memory usage; meaningful only when usageAvailable is true.
    ClusterPodMetrics:
      type: object
      additionalProperties: false
