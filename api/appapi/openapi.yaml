        "404":
          description: "Resource not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Current state conflicts with the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: "ApplyManagementConfiguration"
      security:
      - ManagementConfigure: []
      tags:
      - Management
      summary: "Apply management configuration and component upgrades"
      description: "Configure primary S3 archive storage with s3, local SQLite and OpenBao capture with backups, and encrypted incremental Restic exports to external S3 with offsite. S3 and offsite connections are tested in the background before their active settings are saved. A failed connection test leaves the previous active connection unchanged. Local capture and offsite export have separate schedules. Omitted policy blocks and omitted or empty named collections preserve existing settings and resources. Inline credentials and the Restic password are staged privately in OpenBao before work is accepted. Retain independent recovery copies outside Borq. Poll GetManagementOperation for test results and apply progress."
      parameters: []
      responses:
        "403":
          $ref: '#/components/responses/Forbidden'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "202":
          description: "Accepted operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          description: "Invalid request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "Resource not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Current state conflicts with the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagementConfiguration"
            examples:
              cloudflare-tailscale:
                summary: Cluster-wide networking and external Google Workspace OIDC. Replace all placeholders; credentials are staged privately when applied.
                value:
                  borqPublicUrl: https://borq.example.com
                  network:
                    tailscale:
                      clientId: replace-with-tailscale-oauth-client-id
                      clientSecret: replace-with-tailscale-oauth-client-secret
                    cloudflare:
                      exposure: tunnel
                      wildcardDomain: '*.example.com'
                      zoneId: replace-with-cloudflare-zone-id
                      acmeEmail: admin@example.com
                      apiToken: replace-with-cloudflare-api-token
                  organizations:
                    - name: example
                      oidc:
                        issuerUrl: https://accounts.google.com
                        clientId: replace-with-google-client-id.apps.googleusercontent.com
                        clientSecret: replace-with-google-client-secret
                        adminEmail: admin@example.com
                      clusters:
                        - name: existing
                          inCluster: true
                          reconcile: true
                      spaces:
                        - name: default
                          cluster: existing

