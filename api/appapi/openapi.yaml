          pattern: ^$|^([a-z0-9]([a-z0-9-]*[a-z0-9])?)(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
          type: string
        version:
          description: Published version or latest. Omission in a supplied env reference
            selects latest. Planning pins latest to an existing version; it never
            reserves or creates one. Only the latest and ten previous versions may
            be planned or applied, checked against the current vault head even for
            saved plans.
          pattern: ^(latest|0|[1-9][0-9]*)$
          type: string
      required:
      - name
      - version
      type: object
    EnvReferencePatch:
      additionalProperties: false
