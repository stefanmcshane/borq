  /api/v1/organizations/{organization}/spaces/{space}/apps:
    get:
      operationId: ListApps
      summary: Read the space's expanded app configuration and exact saved manifests.
      description: Returns the latest accepted desired state, including queued or failed applies. Planning alone does not change this state. Both views come from one stored snapshot, with env references pinned and no literal env values.
      parameters:
      - in: path
        name: organization
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
      - in: path
        name: space
        required: true
        schema:
