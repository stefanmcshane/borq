    get:
      operationId: ListAppDeployments
      summary: List recent application releases and deployment progress.
      description: >-
        Returns the newest twenty accepted operations explicitly targeting this app, in descending acceptance time. Includes each release configuration without environment values. Use operation.id with GetOperation; use a succeeded operation ID with PlanAppRollback to restore that release.
