        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid request.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The requested resource does not exist.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The request conflicts with current state or the plan is stale.
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported request Content-Type.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server failure.
      summary: Save a cluster registration, create its initial space, and optionally queue target setup.
      description: Registration validates and saves the connection independently of component setup. Reconciliation is queued by default and runs on the server after this response. Its later failure does not undo registration; inspect GET components or queue an explicit retry. Set reconcile to false to skip setup.
  /api/v1/organizations/{organization}/clusters/{cluster}/kubeconfig:
    get:
      operationId: GetClusterKubeconfig
      parameters:
      - in: path
        name: organization
        required: true
        schema:
