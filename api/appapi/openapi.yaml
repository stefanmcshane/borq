    delete:
      operationId: DeleteApp
      security:
      - AppDelete: []
      tags:
      - Applications
      summary: Delete an application and retain its SQLite data and backups.
      description: >-
        Starts durable removal of this application's owned runtime resources, including
        routes, services, deployments, predeploy jobs and environment projections.
        SQLite volumes, recovery state, backup archives and shared secrets
        are retained. Other applications and the space are preserved. Poll GetOperation
        with the returned ID. The app remains listed until cleanup succeeds; retry
        DeleteApp after a failure. Repeating a pending deletion returns its operation.
        Deletion cannot be canceled. An active deployment or another app deletion
        must finish before deletion can start, and deployments are blocked during deletion.
      x-mcp-idempotent: true
      parameters:
      - $ref: '#/components/parameters/OrganizationPath'
      - $ref: '#/components/parameters/SpacePath'
      - $ref: '#/components/parameters/ApplicationPath'
      responses:
        "403":
          $ref: '#/components/responses/Forbidden'
        "401":
          $ref: '#/components/responses/Unauthenticated'
        "202":
          description: Deletion accepted; poll the returned operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        "400":
          description: Invalid application path or unexpected request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        "404":
          description: Application or space does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        "409":
          description: Another operation is active or accepted state changed; retry after it finishes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        "500":
          description: Unable to accept application deletion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
