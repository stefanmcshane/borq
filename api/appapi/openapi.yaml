  /api/v1/management/configuration:
    get:
      operationId: "GetManagementConfiguration"
      security:
      - ManagementRead: []
      tags:
      - Management
      summary: "Export management configuration with safe credential references"
      description: "Includes primary S3 archive storage, local management backup policy and status under backups, and external Restic backup policy and status under offsite. Exports contain credential references rather than keys or passwords."
      parameters: []
      responses:
        "403":
          $ref: '#/components/responses/Forbidden'
        "401":
