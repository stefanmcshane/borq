    EnvReference:
      additionalProperties: false
      description: Reference to a separately published secret group. Omit name
        to use organization-space-app. Version defaults to latest and is resolved
        and pinned during planning; saved plans contain a decimal version. Version
        0 represents an empty default group.
      properties:
        name:
          description: Secret group name, scoped to this space. Omit to select the
            app's default group.
