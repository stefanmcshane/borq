      summary: Read current application health and accepted settings.
      description: >-
        Compare live Kubernetes resources with the accepted desired configuration. States distinguish healthy, deploying, degraded, stopped, and unavailable. This is read-only; use GetOperation for deployment progress and GetAppLogs for runtime errors.
      parameters:
      - $ref: '#/components/parameters/OrganizationPath'
      - $ref: '#/components/parameters/SpacePath'
      - $ref: '#/components/parameters/ApplicationPath'
      responses:
        "200":
          description: Successful response.
