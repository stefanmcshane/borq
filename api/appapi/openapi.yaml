      summary: Queue reconciliation of missing or failed target components.
      description: Returns immediately with the durable run. Repeating while it is active returns that same run. Poll GET components until ready or failed; stopping the client does not cancel server work. Existing release values and versions change only through the upgrade endpoint.
  /api/v1/organizations/{organization}/clusters/{cluster}/components/upgrade:
