  /api/v1/plans/{plan}/apply:
    post:
      description: Accepts the exact saved plan into the space's FIFO queue. Config
        pins must reference the latest or at most ten previous versions at acceptance
        and execution. Pins are checked again before each predeploy Job and before
        Deployment updates; an aged-out plan fails without changing its pins. Synchronizes
        pinned OpenBao values through External Secrets into immutable Secrets, then
        runs saved predeploy Jobs in deterministic app-name order, waiting for each
        to complete before applying application resources. Failed or expired Jobs
        fail the operation and leave application resources unchanged. A restarted
        server observes the same immutable Jobs rather than starting them again. Reusing
        a plan ID returns its original operation; create a fresh plan for a new attempt.
      operationId: ApplyPlan
      parameters:
      - in: path
        name: plan
        required: true
        schema:
          description: A nonempty user-selected identifier.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          description: Successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid request.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The requested resource does not exist.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The request conflicts with current state or the plan is stale.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server failure.
      summary: Accept and execute the exact saved plan for the whole space.
