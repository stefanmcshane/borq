        health checks, or replica counts. For example, {"apps":[{"name":"web","image":"ghcr.io/acme/web:v2"}]}
        updates only the web image; {"apps":[{"name":"web","replicas":0}]} stops it.
        Omitted apps and fields retain current settings. Only named apps run their configured
        predeploy tasks; an omitted apps field reconciles all apps and their tasks.
        Use immutable image tags or digests.
        This only saves a plan; inspect the diff, then call ApplyPlan and poll GetOperation.
        Accepts partial application updates as application/json. The CLI
        converts apps.yaml to this Patch schema. Request bodies never contain target
        information and must contain one JSON document no larger than 1 MiB; duplicate
        keys, unknown fields, and null values are rejected. An omitted Content-Type
        defaults to application/json.
      operationId: PostPlan
      x-mcp-destructive: false
      parameters:
      - in: path
        name: organization
        required: true
        schema:
          description: A nonempty user-selected identifier.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          type: string
      - in: path
        name: space
        required: true
        schema:
          description: A nonempty user-selected identifier.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patch'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: Successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid request.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The requested resource does not exist.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Target components are not ready, current state conflicts, or the plan is stale. Inspect cluster components or run cluster reconcile before planning a target whose setup is incomplete.
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported request Content-Type.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unexpected server failure.
      summary: Merge and expand a partial update, observe live resources, and save
        an immutable plan.
  /api/v1/plans/{plan}:
    get:
      operationId: GetPlan
      parameters:
      - in: path
        name: plan
        required: true
        schema:
          description: A nonempty user-selected identifier.
          maxLength: 63
          minLength: 1
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
          type: string
      responses:
        "200":
          content:
