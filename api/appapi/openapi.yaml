          description: Successful response.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Invalid request.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The requested resource does not exist.
        "409":
          content:
            application/json:
