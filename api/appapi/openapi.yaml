      description: Read-only inspection of management, SQLite, Pocket ID and PostgreSQL archives, plus separate offsite execution status. Missing and disabled backups remain visible. Archive metadata is evidence of a backup, not proof of a successful restore. Inspection never provisions storage or keys.
