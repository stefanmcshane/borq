apiVersion: v1
kind: Secret
metadata:
  name: borq-admin-auth
  namespace: borq-mgmt
  labels:
    app.kubernetes.io/name: borq
    app.kubernetes.io/component: authentication
    app.kubernetes.io/managed-by: borq
type: Opaque
stringData:
  token: ORIGINAL_BORQ_ADMIN_TOKEN
---
apiVersion: v1
kind: Secret
metadata:
  name: borq-openbao-admin
  namespace: borq-mgmt
  labels:
    app.kubernetes.io/managed-by: borq
    app.kubernetes.io/part-of: borq
type: Opaque
stringData:
  token: ORIGINAL_OPENBAO_ADMIN_TOKEN
  sealKey: ORIGINAL_OPENBAO_STATIC_SEAL_KEY
  bootstrap.hcl: |
    seal "static" {
      current_key_id = "borq-v1"
      current_key = "file:///openbao/borq-bootstrap/sealKey"
    }
    initialize "borq" {
      request "administrator" {
        operation = "update"
        path = "auth/token/create-orphan"
        data = {
          id = {
            eval_source = "file"
            eval_type = "string"
            path = "/openbao/borq-bootstrap/token"
          }
          policies = ["root"]
          no_default_policy = true
          ttl = "0"
        }
      }
    }
